name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jobforge_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-asyncio httpx
        
    - name: Run Tests
      env:
        DB_USER: root
        DB_PASSWORD: root
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_NAME: jobforge_test
        REDIS_HOST: 127.0.0.1
        REDIS_PORT: 6379
        APP_BASE_URL: http://localhost:8000
        TELEGRAM_BOT_TOKEN: "dummy_token"
        TELEGRAM_CHAT_ID: "dummy_id"
        # Note: Avoid exposing real API keys in CI unless needed
        GOOGLE_API_KEY: "dummy_google_key"
      run: |
        # Optional: Run syntax check
        python -m compileall src/ tests/ scripts/
        
        # We run the basic pipeline test (requires real DB but dummy AI keys if we mock them)
        # For now, just ensuring syntax is correct is a great start. 
        # python -m pytest tests/test_pixel_pipeline.py -v
